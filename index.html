
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VYBORA — Music</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090910;color:#fff;font-family:Arial,sans-serif}
header{padding:24px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #252238}
.logo{font-size:28px;font-weight:900;letter-spacing:4px;background:linear-gradient(90deg,#b15cff,#42c9ff);color:transparent;background-clip:text}
header span{color:#aaa;font-size:12px}
main{max-width:1150px;margin:auto;padding:30px 22px 140px}
.hero{padding:35px;border:1px solid #38234f;border-radius:22px;background:radial-gradient(ellipse at 90% 20%,#512b85,transparent 45%),linear-gradient(120deg,#191329,#10101d)}
.hero small{color:#c5a0ff;letter-spacing:3px}
h1{font-size:clamp(32px,5vw,54px);margin:15px 0}
.hero p{color:#c5c1d7}
.search{display:flex;gap:10px;margin:28px 0}
input{min-width:0}
#query{flex:1;background:#151522;border:1px solid #38334d;color:white;border-radius:30px;padding:15px 20px;outline:none}
#query:focus{border-color:#b15cff}
button{cursor:pointer}
#searchBtn{border:0;border-radius:30px;padding:0 22px;color:white;background:linear-gradient(90deg,#9149df,#4268ef);font-weight:bold}
h2{font-size:22px}
#status{color:#aaa;font-size:14px;margin:16px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:17px}
.card{padding:12px;background:#141420;border:1px solid #29263c;border-radius:15px;min-width:0}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#28213a}
.name{font-weight:bold;margin-top:12px;line-height:1.4}
.artist{color:#aaa;font-size:13px;margin-top:5px;min-height:30px}
.actions{display:flex;align-items:center;gap:8px;margin-top:12px}
.play{border:0;border-radius:20px;background:#a855f7;color:white;padding:9px 13px}
.store{color:#9ddcff;font-size:12px;text-decoration:none}
.player{position:fixed;bottom:0;left:0;right:0;padding:14px 20px;background:#11111bf5;border-top:1px solid #343044;display:flex;align-items:center;gap:14px}
#now{flex:1;min-width:0}
#now strong,#now small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#now small{color:#aaa;margin-top:5px}
#toggle{width:44px;height:44px;border:0;border-radius:50%;background:white;color:#111;font-size:18px}
#sound{width:90px;max-width:20vw;accent-color:#b15cff}
audio{display:none}
@media(max-width:520px){header{padding:20px}header span{display:none}.hero{padding:23px}.search{gap:7px}#searchBtn{padding:0 14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.player{gap:10px;padding:12px}#sound{display:none}}
</style>
</head>
<body>
<header>
  <div class="logo">VYBORA</div>
  <span>FEEL EVERY FREQUENCY</span>
</header>
<main>
  <section class="hero">
    <small>YOUR MUSIC UNIVERSE</small>
    <h1>Encuentra tu<br>próxima canción.</h1>
    <p>Busca artistas reales, descubre sus álbumes y escucha los avances disponibles.</p>
  </section>
  <div class="search">
    <input id="query" placeholder="Busca Bad Bunny, Milo J, Feid..." autocomplete="off">
    <button id="searchBtn">BUSCAR</button>
  </div>
  <h2 id="heading">Descubre música</h2>
  <div id="status">Buscando música popular...</div>
  <div class="grid" id="results"></div>
</main>
<div class="player">
  <div id="now"><strong>VYBORA MUSIC</strong><small>Elige una canción</small></div>
  <button id="toggle" aria-label="Reproducir">▶</button>
  <input id="sound" type="range" min="0" max="1" step=".05" value=".7" aria-label="Volumen">
</div>
<audio id="audio"></audio>
<script>
const $=id=>document.getElementById(id);
const audio=$("audio");
let tracks=[];
let selected=null;

async function searchMusic(term){
  if(!term.trim()) return;
  $("heading").textContent="Resultados para: "+term;
  $("status").textContent="Buscando canciones...";
  $("results").innerHTML="";
  $("searchBtn").disabled=true;
  try{
    const url="https://itunes.apple.com/search?term="+encodeURIComponent(term)+"&entity=song&limit=36&country=PE";
    const response=await fetch(url);
    if(!response.ok) throw new Error("Error de conexión");
    const data=await response.json();
    tracks=data.results||[];
    if(!tracks.length){
      $("status").textContent="No encontramos resultados. Prueba otro artista.";
      return;
    }
    $("status").textContent=tracks.length+" canciones encontradas · Avances proporcionados por iTunes";
    $("results").innerHTML=tracks.map((t,i)=>`
      <article class="card">
        <img src="${t.artworkUrl100||""}" alt="Portada de ${escapeHTML(t.trackName)}" loading="lazy">
        <div class="name">${escapeHTML(t.trackName||"Canción")}</div>
        <div class="artist">${escapeHTML(t.artistName||"Artista desconocido")}<br>${escapeHTML(t.collectionName||"")}</div>
        <div class="actions">
          <button class="play" data-play="${i}">${t.previewUrl?"▶ Escuchar":"Ver canción"}</button>
          <a class="store" href="${t.trackViewUrl||"#"}" target="_blank" rel="noopener">iTunes ↗</a>
        </div>
      </article>`).join("");
  }catch(e){
    $("status").textContent="No se pudo conectar al catálogo. Comprueba Internet e inténtalo otra vez.";
  }finally{
    $("searchBtn").disabled=false;
  }
}
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
$("searchBtn").addEventListener("click",()=>searchMusic($("query").value));
$("query").addEventListener("keydown",e=>{
  if(e.key==="Enter")searchMusic($("query").value);
});
$("results").addEventListener("click",e=>{
  const btn=e.target.closest("[data-play]");
  if(!btn)return;
  const t=tracks[Number(btn.dataset.play)];
  if(!t)return;
  if(!t.previewUrl){
    if(t.trackViewUrl)window.open(t.trackViewUrl,"_blank","noopener");
    return;
  }
  if(selected===t.trackId&&!audio.paused){
    audio.pause();
    return;
  }
  selected=t.trackId;
  audio.src=t.previewUrl;
  audio.play().then(()=>{
    $("now").innerHTML=`<strong>${escapeHTML(t.trackName)}</strong><small>${escapeHTML(t.artistName)} · Avance de iTunes</small>`;
    $("toggle").textContent="Ⅱ";
  }).catch(()=>{
    $("status").textContent="No se pudo reproducir este avance. Prueba otra canción.";
  });
});
$("toggle").addEventListener("click",()=>{
  if(!audio.src){
    $("query").focus();
    $("status").textContent="Primero busca y elige una canción.";
  }else if(audio.paused){
    audio.play().catch(()=>{});
  }else audio.pause();
});
audio.addEventListener("play",()=>$("toggle").textContent="Ⅱ");
audio.addEventListener("pause",()=>$("toggle").textContent="▶");
$("sound").addEventListener("input",e=>audio.volume=Number(e.target.value));
audio.volume=.7;
searchMusic("Bad Bunny");
</script>
</body>
</html>
